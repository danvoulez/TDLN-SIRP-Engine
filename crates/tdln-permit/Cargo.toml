[package]
name = "tdln-permit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Execution Permit emit/verify for TDLN control plane"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
