
[package]
name = "engine-http"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
tower-http = { version = "0.5", features = ["trace"] }
engine-exec-wasm = { path = "../engine-exec-wasm" }


[features]
default = []
