[workspace]
resolver = "2"
members = [
  "crates/engine-audit",
  "crates/engine-auth",
  "crates/engine-core",
  "crates/engine-exec-wasm",
  "crates/engine-extras",
  "crates/engine-http",
  "crates/engine-registry",
  "crates/tdln-certified-runtime",
  "crates/tdln-permit",
  "crates/tdln-runner",
  "crates/tdln-runtime-wasm",
  "wrappers/*/domain",
  "wrappers/*/service"
]
exclude = ["crates/wrapper-template"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.metadata.ci]
rust_channel = "stable"
